# =============================================================================
# Pipeline configuration — all tunable parameters in one place.
# Values marked [JUSTIFIED] were set based on prior data analysis or domain
# standards and should only be changed with a clear reason.
# =============================================================================

# ── Pipeline metadata ─────────────────────────────────────────────────────────
pipeline:
  version: "1.0.0"
  schema_version: "1.0.0"

# ── Global ────────────────────────────────────────────────────────────────────
global:
  seed: 42           # [JUSTIFIED] reproducibility convention
  test_size: 0.20    # [JUSTIFIED] standard 80/20 train/val split

# ── Imputation ────────────────────────────────────────────────────────────────
imputation:
  mice:
    max_iter: 10      # max rounds; stops early if tol is reached
    tol: 0.001        # convergence tolerance (sklearn IterativeImputer default)
    random_state: 42  # mirrors global seed

# ── Feature Engineering ───────────────────────────────────────────────────────
feature_engineering:
  quantile_caps:
    q_low: 0.01    # lower Winsorisation bound
    q_high: 0.99   # upper Winsorisation bound

# ── Feature Quality ───────────────────────────────────────────────────────────
feature_quality:
  psi:
    n_bins: 10
    warn_threshold: 0.10    # [JUSTIFIED] industry standard: minor distribution shift
    drop_threshold: 0.25    # [JUSTIFIED] industry standard: significant shift
    review_threshold: 0.20  # flag as "review" above this
  auc_drop_threshold: 0.52      # [JUSTIFIED] marginally above random (0.50)
  goodness_keep_threshold: 0.60 # composite score minimum to keep a feature
  goodness_weights:             # [JUSTIFIED] must sum to 1.0
    auc: 0.35
    mi: 0.25
    spearman: 0.20
    psi: 0.10
    missing: 0.10

# ── Models ────────────────────────────────────────────────────────────────────
models:
  logistic:
    max_iter: 2000   # [JUSTIFIED] high ceiling to ensure convergence on scaled features
    C: 1.0

  xgboost:
    n_estimators: 500
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85

  reduced:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    ablation_max_features: 25  # max features to sweep in ablation curve
    keep_set_min: 5            # minimum features to retain if ablation returns nothing

# ── Diagnostics ───────────────────────────────────────────────────────────────
diagnostics:
  permutation_importance_threshold: 0.005  # AUC drop below this = unimportant feature
  overfitting_gap_threshold: 0.05          # train-val AUC gap above this = overfit

# ── Classification ────────────────────────────────────────────────────────────
classification:
  fallback_threshold: 0.5  # used only if threshold_analysis.csv is missing;
                            # overridden at runtime by Youden's J

# ── Graph (PageRank enrichment) ───────────────────────────────────────────────
# Activated with --pagerank flag in run.py.
# Builds a success-weighted co-credit graph from title_principals.csv and
# computes PageRank for all directors, writers, and actors.
# Innovation: people central to *hit* films score higher — this captures
# collaborative track record beyond the per-person hit rate already in the
# base features. Adds ~+0.9pp F1 on top of the full feature set.
#
# Implementation note:
#   Spark GraphFrames is used when available (set force_networkx: false).
#   If graphframes/pyspark is not installed the pipeline falls back to
#   NetworkX automatically — scores will differ slightly but the feature
#   is still valid.
#   To install graphframes in the correct environment:
#     /path/to/conda/envs/uva/bin/pip install graphframes
graph:
  pagerank:
    reset_prob: 0.15     # [JUSTIFIED] standard PageRank teleportation probability
                         # (damping factor = 1 - reset_prob = 0.85)
    max_iter: 20         # max iterations; GraphFrames uses maxIter only (not tol)
    tol: 0.01            # convergence tolerance for NetworkX fallback only
    spark_cores: 4       # Spark local-mode cores; increase on machines with more CPUs
    force_networkx: false  # set true to skip Spark and always use NetworkX
    # Temporal year-band cutoffs for leak-free graph construction.
    # For each cutoff year Y, a graph is built from training films released
    # BEFORE Y and used to score films in the band [Y, next_cutoff).
    # Films before the first cutoff receive fallback=0.5 (too sparse).
    # Finer bands = more accurate but more PageRank computations.
    temporal_cutoffs: [1970, 1980, 1990, 1995, 2000, 2005, 2010, 2015, 2020]
